name: C++20 Derivatives CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cxx: g++
            cc: gcc
          - os: ubuntu-latest
            cxx: clang++
            cc: clang
          - os: windows-latest
            cxx: cl
            cc: cl

    steps:
    - uses: actions/checkout@v4

    - name: Set Compiler Environment
      if: runner.os == 'Linux'
      run: |
        echo "CXX=${{ matrix.cxx }}" >> $GITHUB_ENV
        echo "CC=${{ matrix.cc }}" >> $GITHUB_ENV

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Targets
      run: cmake --build build --config Release

    - name: Run Unit Tests
      run: ctest --test-dir build --output-on-failure -C Release

    - name: Run Pricing Benchmark
      shell: bash
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          ./build/Release/derivatives_engine.exe
        else
          ./build/derivatives_engine
        fi

    - name: Run Python Validation
      shell: bash
      run: |
        python python/derivatives_validation.py
